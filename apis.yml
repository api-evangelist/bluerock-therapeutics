description: 'BlueRock Therapeutics is a biopharmaceutical company focused on developing transformative cell therapies for neurodegenerative and ophthalmic diseases. Leveraging advanced stem cell technologies, the company aims to address unmet medical needs in Parkinson’s disease, Alzheimer’s disease, and retinal disorders, advancing candidates through preclinical and clinical stages to bring innovative treatments to patients.'

